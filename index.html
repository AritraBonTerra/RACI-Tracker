<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RACI Tracker</title>
    <!-- Inline so the browser stops asking for /favicon.ico, which is the one
         404 that would otherwise sit in the console during a demo. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23003366'/%3E%3Ctext x='16' y='22' font-family='ui-sans-serif,system-ui,sans-serif' font-size='15' font-weight='700' text-anchor='middle' fill='%230099cc'%3ER%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Applies the saved theme before first paint so a light-mode reload never
         flashes dark. src/lib/theme.tsx owns the choice from then on. -->
    <script>
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem("raci-theme");
        } catch {}
        const light =
          preference === "light" ||
          (preference !== "dark" &&
            matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
